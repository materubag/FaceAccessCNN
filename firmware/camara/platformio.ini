; Cámara: ESP32-CAM AI Thinker (OV2640 con PSRAM), stream MJPEG por HTTP en el puerto 81.
; pioarduino trae el core Arduino 3.x; la plataforma oficial de PlatformIO trae el 2.x.
;
; Primera carga por USB (base ESP32-CAM-MB o adaptador serie con GPIO0 a GND):
;                          pio run -e esp32cam -t upload
; Monitor serie:           pio device monitor
; Cargas siguientes OTA:   $env:CAMARA_OTA_PASSWORD="tu-clave"; pio run -e ota -t upload

[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Igual que "Minimal SPIFFS" en Arduino IDE: deja espacio para OTA.
board_build.partitions = min_spiffs.csv
build_flags =
  -DBOARD_HAS_PSRAM

[env:ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = camara.local
upload_flags = --auth=${sysenv.CAMARA_OTA_PASSWORD}
