; Pluma: ESP32 DevKit V1 (30 pines) con un servo SG90.
; pioarduino trae el core Arduino 3.x; la plataforma oficial de PlatformIO trae el 2.x.
;
; Primera carga por USB:   pio run -e devkit -t upload
; Monitor serie:           pio device monitor
; Cargas siguientes OTA:   $env:PLUMA_OTA_PASSWORD="tu-clave"; pio run -e ota -t upload

[env:devkit]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

[env:ota]
extends = env:devkit
upload_protocol = espota
upload_port = pluma.local
upload_flags = --auth=${sysenv.PLUMA_OTA_PASSWORD}
